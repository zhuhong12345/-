    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {

        .card-wrapper {

        .verify-card {

        .avatar-box {

            border: 2px solid #ff8ab4;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .input-box {
            width: 100%;
            height: 48px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 15px;
            margin-bottom: 16px;
            background-color: #fff;
        }

        .verify-btn {
            width: 100%;
            height: 52px;
            background-color: #ff5a9d;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .verify-btn:hover {
            background-color: #ff3b89;
        }

        .msg-box {
            width: 100%;
            height: 45px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            margin-top: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .msg-success {
            background-color: #e6fff0;
            color: #27ae60;
            border: 1px solid #a9e9c6;
        }

        .msg-error {
            background-color: #fff1f0;
            color: #e74c3c;
            border: 1px solid #f5b5b0;
        }

        .msg-show {
            opacity: 1;
            transform: translateY(0);
        }

        .bottom-area {
            width: 100%;
            height: 60px;
            background-color: #ffe6ee;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #d9688c;
            font-weight: bold;
            margin-top: 12px;
        }

        #app {
            display: none;
        }

        #countdownBox {
            position: fixed;
            top: 20px;
            left: 20px;
            width: auto;
            min-width: 160px;
            padding: 10px 12px;
            background: rgba(255,255,255,1);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #ff3b89;
            cursor: move;
            z-index: 99999;
            user-select: none;
            white-space: nowrap;
        }
    </style>
</head>

<body>

<div id="countdownBox">⏱ 5秒后进入</div>

            <div class="avatar-box">
                <img src="1768953712907.png" alt="头像">
            </div>
            <input type="text" id="cardKeyInput" class="input-box" placeholder="请输入卡密">
            <button onclick="verifyCard()" class="verify-btn">验证</button>
            <div id="msgBox" class="msg-box"></div>

</div>

<div id="app" class="bg-gray-100 min-h-screen">
    <div class="bg-white rounded-xl mx-4 mt-4 p-4 card-shadow">
        <div class="flex items-center">
            <img src="1768953712907.png" alt="头像" class="w-14 h-14 rounded-full mr-3 border-2 border-primary/20">
            <div>
                <h1 class="text-[clamp(1.2rem,3vw,1.5rem)] font-bold text-textDark">木北网盘</h1>
                <p class="text-sm text-textLight">每天更新资源，有问题欢迎加群反馈！群:1051104087</p>

    <div class="bg-white rounded-xl mx-4 mt-4 p-4 card-shadow">

        <div class="grid grid-cols-2 gap-3">
            <a href="https://qm.qq.com/cgi-bin/qm/qr?k=RANDOM_KEY&group_code=1051104087
" target="_blank" class="bg-primary text-white py-2.5 rou10ed-lg font-medium transition-all hover:bg-primary/90 text-center block">加入QQ群</a>
            <a href="https://www.123912.com/s/5sACvd-weNN" target="_blank" class="bg-primary text-white py-2.5 rounded-lg font-medium transition-all hover:bg-primary/90 text-center block">弱网</a>
        </div>
    </div>

    <div class="space-y-3 mx-4 mt-4 mb-8">
        <div class="bg-white rounded-xl p-4 card-shadow transition-all hover:menu-item-active">
            <div class="flex items-center justify-between menu-toggle cursor-pointer">
                <span class="text-base font-medium text-textDark">和平精英</span>
                <i class="fa fa-chevron-right text-textLight text-sm transition-transform duration-300"></i>
            </div>
            <div class="submenu mt-2 pl-4 space-y-2">
                <a href="https://www.123912.com/s/5sACvd-feNN" target="_blank" class="block py-2 text-textLight hover:text-primary transition-colors">美化</a>
                <a href="https://www.123912.com/s/5sACvd-aeNN" target="_blank" class="block py-2 text-textLight hover:text-primary transition-colors">功能pak</a>
            </div>
        </div>

        <div class="bg-white rounded-xl p-4 card-shadow transition-all hover:menu-item-active">
            <div class="flex items-center justify-between menu-toggle cursor-pointer">
                <span class="text-base font-medium text-textDark">PUBG</span>
                <i class="fa fa-chevron-right text-textLight text-sm transition-transform duration-300"></i>
            </div>
            <div class="submenu mt-2 pl-4 space-y-2">
                <a href="https://www.123912.com/s/5sACvd-BeNN" target="_blank" class="block py-2 text-textLight hover:text-primary transition-colors">功能pak</a>
                <a href="https://www.123912.com/s/5sACvd-JeNN" target="_blank" class="block py-2 text-textLight hover:text-primary transition-colors">美化</a>
            </div>
        </div>

        <div class="bg-white rounded-xl p-4 card-shadow transition-all hover:menu-item-active">
            <div class="flex items-center justify-between menu-toggle cursor-pointer">
                <span class="text-base font-medium text-textDark">三角洲</span>
                <i class="fa fa-chevron-right text-textLight text-sm transition-transform duration-300"></i>
            </div>
            <div class="submenu mt-2 pl-4 space-y-2">
                <a href="https://www.123912.com/s/5sACvd-IeNN" target="_blank" class="block py-2 text-textLight hover:text-primary transition-colors">pak/配置</a>
            </div>
        </div>

        <div class="bg-white rounded-xl p-4 card-shadow transition-all hover:menu-item-active">
            <div class="flex items-center justify-between menu-toggle cursor-pointer">
                <span class="text-base font-medium text-textDark">暗区</span>
                <i class="fa fa-chevron-right text-textLight text-sm transition-transform duration-300"></i>
            </div>
            <div class="submenu mt-2 pl-4 space-y-2">
                <a href="https://www.123912.com/s/5sACvd-MeNN" target="_blank" class="block py-2 text-textLight hover:text-primary transition-colors">文件pak/配置</a>
            </div>
        </div>
    </div>
</div>

<script>
    const msgBox = document.getElementById('msgBox');
    const input = document.getElementById('cardKeyInput');
    const verifyPage = document.getElementById('verifyPage');
    const app = document.getElementById('app');
    const countdownBox = document.getElementById('countdownBox');

    const LOGIN_DURATION = 25200000;
    let expireTimer = null;

    window.onload = function () {
        const loginTime = localStorage.getItem('loginTime');
        if (loginTime) {
            const now = Date.now();
            const login = Number(loginTime);
            if (now - login < LOGIN_DURATION) {
                verifyPage.style.display = 'none';
                app.style.display = 'block';
                document.body.style.backgroundColor = '#f3f4f6';
                countdownBox.style.display = 'flex';
                startExpireCountdown(login + LOGIN_DURATION);
            } else {
                localStorage.removeItem('loginTime');
                forceLogout();
            }
        }
    }

    makeDraggable(countdownBox);
    function makeDraggable(el) {
        let mx, my, dx, dy;
        el.onmousedown = start;
        el.ontouchstart = e => {
            start(e.touches[0]);
        };
        function start(e) {
            mx = e.clientX;
            my = e.clientY;
            document.onmousemove = move;
            document.ontouchmove = e => {
                move(e.touches[0]);
            };
            document.onmouseup = stop;
            document.ontouchend = stop;
        }
        function move(e) {
            dx = e.clientX - mx;
            dy = e.clientY - my;
            mx = e.clientX;
            my = e.clientY;
            el.style.left = el.offsetLeft + dx + 'px';
            el.style.top = el.offsetTop + dy + 'px';
        }
        function stop() {
            document.onmousemove = null;
            document.ontouchmove = null;
            document.onmouseup = null;
            document.ontouchend = null;
        }
    }

    function showMsg(text, isSuccess) {
        msgBox.textContent = text;
        msgBox.className = 'msg-box msg-show ' + (isSuccess ? 'msg-success' : 'msg-error');
        setTimeout(() => {
            msgBox.className = 'msg-box';
        }, 3000);
    }

    // 强制退出
    function forceLogout() {
        localStorage.removeItem('loginTime');
        if (expireTimer) clearInterval(expireTimer);
        verifyPage.style.display = 'flex';
        app.style.display = 'none';
        countdownBox.style.display = 'none';
        document.body.style.backgroundColor = '#222';
        alert('登录已过期，请重新验证卡密！');
    }

    // 7小时到期倒计时显示
    function startExpireCountdown(expireTime) {
        expireTimer = setInterval(() => {
            const now = Date.now();
            let left = expireTime - now;
            if (left <= 0) {
                clearInterval(expireTimer);
                forceLogout();
                return;
            }
            let h = Math.floor(left / 3600000);
            let m = Math.floor((left % 3600000) / 60000);
            let s = Math.floor((left % 60000) / 1000);
            countdownBox.innerText = `⏱ 剩余 ${h}时${m}分${s}秒`;
        }, 1000);
    }

    function verifyCard() {
        const userInput = input.value.trim();
        if (userInput === '4569') {
            showMsg('✅ 验证成功！欢迎使用', true);
            const loginTime = Date.now();
            localStorage.setItem('loginTime', loginTime);

            // 5秒进入倒计时
            countdownBox.style.display = 'flex';
            let sec = 5;
            let timer = setInterval(() => {
                sec--;
                countdownBox.innerText = `⏱ ${sec}秒后进入`;
                if (sec <= 0) {
                    clearInterval(timer);
                    verifyPage.style.display = 'none';
                    app.style.display = 'block';
                    document.body.style.backgroundColor = '#f3f4f6';
                    // 启动7小时到期倒计时
                    startExpireCountdown(loginTime + LOGIN_DURATION);
                }
            }, 1000);

        } else {
            showMsg('❌ 卡密错误，请重新输入', false);
        }
        input.value = '';
    }

    document.querySelectorAll('.menu-toggle').forEach(toggle => {
        const submenu = toggle.nextElementSibling;
        const icon = toggle.querySelector('i');
        toggle.addEventListener('click', () => {
            submenu.classList.toggle('open');
            icon.classList.toggle('rotate-90');
        });
    });

    document.querySelectorAll('.submenu a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    });
</script>
</body>
</html>
